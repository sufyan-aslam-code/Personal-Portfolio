<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Sufyan Aslam — Portfolio</title>
    <meta name="description" content="Sufyan Aslam — Full-Stack Developer & AI Engineer. Explore my projects, skills, and professional experience." />
    <meta name="author" content="Sufyan Aslam" />
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:title" content="Sufyan Aslam — Full-Stack Developer & AI Engineer" />
    <meta property="og:description" content="Explore my projects, full-stack web engineering, and backend AI agent systems." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sufyan Aslam — Full-Stack Developer & AI Engineer" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- FOUC Prevention Script -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
